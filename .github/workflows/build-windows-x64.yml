name: Build Windows x64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  build-windows-x64:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Initialize
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ntldd
            git
            base-devel
            wget
            unzip

      - name: Install boost 1.85.0
        run: |
          set -ex
          cd /tmp

          BOOST_VERSION=1.85.0
          BOOST_FILE="boost_1_85_0.tar.gz"
          BOOST_SHA256="be0d91732d5b0cc6fbb275c7939974457e79b54d6f07ce2e3dfdd68bef883b0b"

          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/${BOOST_FILE}"

          echo "${BOOST_SHA256}  ${BOOST_FILE}" | sha256sum -c -

          tar -xzf "${BOOST_FILE}"
          cd boost_1_85_0

          ./bootstrap.sh --with-toolset=gcc \
            --with-libraries=chrono,date_time,filesystem,locale,program_options,regex,serialization,system,thread

          ./b2 -j$(nproc) toolset=gcc target-os=windows \
            variant=release \
            threading=multi \
            link=static \
            runtime-link=shared \
            address-model=64 \
            --layout=system \
            boost.locale.icu=off \
            install --prefix=/mingw64

      - name: Download daemon
        run: |
          set -ex
          MONERO_VERSION=0.18.5.1
          FILE="monero-win-x64-v${MONERO_VERSION}.zip"
          FILE_CHECKSUM="cf2ae8273977697d9ef2031c7337b781e6e5936578f602444b2990a173a2437d"

          cd /tmp
          wget -qO "${FILE}" "https://downloads.getmonero.org/cli/${FILE}"
          echo "${FILE_CHECKSUM} ${FILE}" | sha256sum -c -
          
          mkdir -p bin
          unzip -j "${FILE}" "*/monerod.exe" -d bin

          mkdir -p "${GITHUB_WORKSPACE}/monero-cli"
          cp bin/monerod.exe "${GITHUB_WORKSPACE}/monero-cli/"

      - name: Node start
        shell: pwsh
        run: |
          Start-Process -FilePath "monero-cli\monerod.exe" -ArgumentList @(
            "--p2p-bind-ip=0.0.0.0",
            "--p2p-bind-port=18080",
            "--rpc-bind-port=18081",
            "--log-level=2",
            "--rpc-bind-ip=0.0.0.0",
            "--confirm-external-bind",
            "--regtest",
            "--no-igd",
            "--hide-my-port",
            "--non-interactive"
          ) -WindowStyle Hidden

      - name: Build Monero project
        run: |
          cd submodules/monero-cpp/external/monero-project

          mkdir -p build/release
          cd build/release

          cmake -G "MSYS Makefiles" \
            -D STATIC=ON \
            -D ARCH="x86-64" \
            -D BUILD_64=ON \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_TAG="win-x64" \
            -D CMAKE_TOOLCHAIN_FILE="../../cmake/64-bit-toolchain.cmake" \
            -D MSYS2_FOLDER=$(cd $MINGW_PREFIX/.. && pwd -W) \
            ../../

          make wallet cryptonote_protocol -j$(nproc)

      - name: Build Monero C++
        run: |
          cmake -S submodules/monero-cpp -B submodules/monero-cpp/build -DCMAKE_POLICY_DEFAULT_CMP0167=NEW
          cmake --build submodules/monero-cpp/build

      - name: Upload monero-cpp library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-cpp-win-x64.dll
          path: submodules/monero-cpp/build/libmonero-cpp.dll

      - name: Upload monero-cpp import library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-cpp-win-x64.dll.a
          path: submodules/monero-cpp/build/libmonero-cpp.dll.a

      - name: Build monero-c
        run: |
          cmake -S MoneroC -B MoneroC/build -DCMAKE_POLICY_DEFAULT_CMP0167=NEW
          cmake --build MoneroC/build

      - name: Upload monero-c library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-c-win-x64.dll
          path: MoneroC/build/libmonero-c.dll

      - name: Upload monero-c import library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-c-win-x64.dll.a
          path: MoneroC/build/libmonero-c.dll.a

      - name: Build CsharpTestApp
        shell: pwsh
        run: dotnet build CsharpTestApp -maxcpucount:1 -c Release

      - name: Copy native C++ library
        run: cp submodules/monero-cpp/build/libmonero-cpp.dll CsharpTestApp/bin/Release/net10.0/

      - name: Copy native C library
        run: cp MoneroC/build/libmonero-c.dll CsharpTestApp/bin/Release/net10.0/monero-c.dll

      - name: Run CsharpTestApp
        run: |
          cd CsharpTestApp/bin/Release/net10.0
          ./CsharpTestApp.exe