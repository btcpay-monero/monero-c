name: Build Linux ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-linux-arm64:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Initialize
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools
        run:  |
          sudo apt update
          sudo apt install -y cmake g++ make libunbound-dev libboost-all-dev libzmq3-dev libhidapi-dev \
            libprotobuf-dev protobuf-compiler libusb-1.0-0-dev libevent-dev

      - name: Download daemon
        run: |
          set -ex
          MONERO_VERSION=0.18.5.1
          FILE="monero-linux-armv8-v${MONERO_VERSION}.tar.bz2"
          FILE_CHECKSUM="c0caf042cb7c7b760f5ad6be188084b59352440b32990a78b8051497b9398dbc"

          cd /tmp
          wget -qO "${FILE}" "https://downloads.getmonero.org/cli/${FILE}"
          echo "${FILE_CHECKSUM} ${FILE}" | sha256sum -c -

          mkdir -p bin
          tar -xjf "${FILE}" -C bin --strip-components=1 --wildcards "*/monerod"

          mkdir -p "${GITHUB_WORKSPACE}/monero-cli"
          cp bin/monerod "${GITHUB_WORKSPACE}/monero-cli/"
          chmod +x "${GITHUB_WORKSPACE}/monero-cli/monerod"

      - name: Node start
        run: |
          ./monero-cli/monerod \
            --p2p-bind-ip=0.0.0.0 \
            --p2p-bind-port=18080 \
            --rpc-bind-port=18081 \
            --log-level=2 \
            --rpc-bind-ip=0.0.0.0 \
            --confirm-external-bind \
            --regtest \
            --no-igd \
            --hide-my-port \
            --non-interactive \
            --detach

      - name: Build Monero project
        run: |
          cmake -S submodules/monero-cpp/external/monero-project \
            -B submodules/monero-cpp/external/monero-project/build/release \
            -DSTATIC=ON \
            -DBUILD_64=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build submodules/monero-cpp/external/monero-project/build/release \
            --target wallet cryptonote_protocol \
            -j$(nproc)
            
      - name: Build Monero C++
        run: |
          cmake -S submodules/monero-cpp -B submodules/monero-cpp/build
          cmake --build submodules/monero-cpp/build -j$(nproc)

      - name: Upload monero-cpp library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-cpp-linux-arm64.so
          path: submodules/monero-cpp/build/libmonero-cpp.so
            
      - name: Build monero-c
        run: |
          cmake -S MoneroC -B MoneroC/build
          cmake --build MoneroC/build

      - name: Upload monero-c
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-c-linux-arm64.so
          path: MoneroC/build/libmonero-c.so

      - name: Build CsharpTestApp
        run: dotnet build CsharpTestApp -maxcpucount:1 -c Release

      - name: Copy native library
        run:  cp MoneroC/build/libmonero-c.so CsharpTestApp/bin/Release/net10.0/

      - name: Run CsharpTestApp
        run: |
          cd CsharpTestApp/bin/Release/net10.0
          LD_LIBRARY_PATH=. dotnet CsharpTestApp.dll
