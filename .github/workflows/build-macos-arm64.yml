name: Build macOS ARM64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      - name: Initialize
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools
        run:  |
          brew install boost@1.85 zeromq hidapi protobuf unbound

      - name: Download daemon
        run: |
          set -ex
          MONERO_VERSION=0.18.5.1
          FILE="monero-mac-armv8-v${MONERO_VERSION}.tar.bz2"
          FILE_CHECKSUM="dba08921841e675384ce019fd7c93b59fe7b1e6edaa0a3cf0e3253e263f61864"

          cd /tmp
          curl -fsSL -o "${FILE}" "https://downloads.getmonero.org/cli/${FILE}"
          echo "${FILE_CHECKSUM}  ${FILE}" | shasum -a 256 -c -

          mkdir -p bin
          MONEROD=$(tar -tjf "${FILE}" | grep '/monerod$')
          tar -xjf "${FILE}" -C bin "${MONEROD}"

          mkdir -p "${GITHUB_WORKSPACE}/monero-cli"
          cp "bin/${MONEROD}" "${GITHUB_WORKSPACE}/monero-cli/monerod"
          chmod +x "${GITHUB_WORKSPACE}/monero-cli/monerod"

      - name: Node start
        run: |
          ./monero-cli/monerod \
            --p2p-bind-ip=0.0.0.0 \
            --p2p-bind-port=18080 \
            --rpc-bind-port=18081 \
            --log-level=2 \
            --rpc-bind-ip=0.0.0.0 \
            --confirm-external-bind \
            --regtest \
            --no-igd \
            --hide-my-port \
            --non-interactive \
            --detach

      - name: Build Monero project
        run: |
          cmake -S submodules/monero-cpp/external/monero-project \
            -B submodules/monero-cpp/external/monero-project/build/release \
            -DSTATIC=ON \
            -DBUILD_64=ON \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build submodules/monero-cpp/external/monero-project/build/release \
            --target wallet cryptonote_protocol
            
      - name: Build Monero C++
        run: |
          cmake -S submodules/monero-cpp -B submodules/monero-cpp/build
          cmake --build submodules/monero-cpp/build

      - name: Upload monero-cpp library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-cpp-macos-arm64.dylib
          path: submodules/monero-cpp/build/libmonero-cpp.dylib
            
      - name: Build monero-c
        run: |
          cmake -S MoneroC -B MoneroC/build
          cmake --build MoneroC/build

      - name: Upload monero-c
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-c-macos-arm64.dylib
          path: MoneroC/build/libmonero-c.dylib

      - name: Build CsharpTestApp
        run: dotnet build CsharpTestApp -maxcpucount:1 -c Release

      - name: Copy native library
        run:  cp MoneroC/build/libmonero-c.dylib CsharpTestApp/bin/Release/net10.0/

      - name: Run CsharpTestApp
        run: |
          cd CsharpTestApp/bin/Release/net10.0
          DYLD_LIBRARY_PATH=. dotnet CsharpTestApp.dll